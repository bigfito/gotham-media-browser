<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="920" viewBox="0 0 1360 920" role="img">
  <title>Gotham Media Browser denormalized ES model — entity search capabilities</title>
  <rect width="1360" height="920" fill="#F8FAFC"/>
  <text x="40" y="40" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#0F172A">Gotham News &amp; Media Browser — Denormalized ES Model</text>
  <text x="40" y="62" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#475569">Index: gotham-media-browser · entity-scoped search · Elasticsearch 9.x</text>

  <!-- Capability matrix -->
  <rect x="40" y="85" width="400" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="56" y="110" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#064E3B">Article</text>
  <text x="56" y="132" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#065F46">Full-text · Semantic · Hybrid</text>
  <text x="56" y="154" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#94A3B8">Vector: not enabled</text>
  <text x="56" y="176" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#047857">article_search_text + article_semantic</text>

  <rect x="460" y="85" width="400" height="110" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/>
  <text x="476" y="110" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7C2D12">Journalist</text>
  <text x="476" y="132" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9A3412">Full-text · Semantic · Hybrid</text>
  <text x="476" y="154" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#94A3B8">Vector: not enabled</text>
  <text x="476" y="176" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#C2410C">journalist_search_text + journalist_semantic</text>

  <rect x="880" y="85" width="440" height="110" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="896" y="110" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">Multimedia asset</text>
  <text x="896" y="132" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1D4ED8">Full-text · Semantic · Hybrid · Vector</text>
  <text x="896" y="154" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#2563EB">Vector: enabled (asset_vector)</text>
  <text x="896" y="176" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#1D4ED8">multimedia_* + multimedia.asset_vector</text>

  <rect x="40" y="220" width="1280" height="620" rx="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <text x="60" y="250" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#0F172A">Article Document  (_id = article_id)</text>

  <rect x="60" y="270" width="1240" height="70" rx="8" fill="#0F766E"/>
  <text x="76" y="295" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1 · Editorial + metadata</text>
  <text x="76" y="318" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#CCFBF1">title, subtitle, summary, body, slug, status, language, dates, section, tags, location, source, seo_*</text>

  <rect x="60" y="355" width="600" height="130" rx="8" fill="#7C2D12"/>
  <text x="76" y="380" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2a · journalists[] nested</text>
  <text x="76" y="404" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#FED7AA">Names, bios, byline_order, contribution_role</text>
  <text x="76" y="426" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#FED7AA">Root helpers: journalist_names, journalist_bios</text>
  <text x="76" y="456" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FDBA74">No dense_vector on journalists</text>

  <rect x="680" y="355" width="620" height="130" rx="8" fill="#1D4ED8"/>
  <text x="696" y="380" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2b · multimedia[] nested</text>
  <text x="696" y="404" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#BFDBFE">IMAGE | AUDIO | VIDEO + metadata text fields</text>
  <text x="696" y="426" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#BFDBFE">Root helper: multimedia_text</text>
  <rect x="696" y="440" width="280" height="28" rx="6" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="708" y="459" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1E3A8A">asset_vector : dense_vector(768)</text>

  <rect x="60" y="505" width="400" height="140" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text x="76" y="530" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#78350F">Article projections</text>
  <text x="76" y="555" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#92400E">article_search_text (text)</text>
  <text x="76" y="575" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#92400E">article_semantic (semantic_text)</text>
  <text x="76" y="605" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#059669">FTS · Semantic · Hybrid</text>
  <text x="76" y="625" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#94A3B8">No vector field</text>

  <rect x="480" y="505" width="400" height="140" rx="8" fill="#FFEDD5" stroke="#EA580C"/>
  <text x="496" y="530" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#7C2D12">Journalist projections</text>
  <text x="496" y="555" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9A3412">journalist_search_text (text)</text>
  <text x="496" y="575" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#9A3412">journalist_semantic (semantic_text)</text>
  <text x="496" y="605" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#059669">FTS · Semantic · Hybrid</text>
  <text x="496" y="625" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#94A3B8">No vector field</text>

  <rect x="900" y="505" width="400" height="140" rx="8" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="916" y="530" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1E3A8A">Multimedia projections</text>
  <text x="916" y="555" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1D4ED8">multimedia_search_text (text)</text>
  <text x="916" y="575" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1D4ED8">multimedia_semantic (semantic_text)</text>
  <text x="916" y="595" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#1D4ED8">multimedia.asset_vector (dense_vector)</text>
  <text x="916" y="625" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1D4ED8">FTS · Semantic · Hybrid · Vector</text>

  <text x="60" y="680" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">copy_to: editorial/metadata → article_* · journalist helpers → journalist_* · multimedia_text → multimedia_*</text>
  <text x="60" y="705" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#475569">Hybrid article/journalist = RRF(FTS, semantic). Hybrid multimedia = RRF(FTS, semantic, knn asset_vector).</text>

  <rect x="60" y="740" width="18" height="18" rx="3" fill="#D1FAE5" stroke="#059669"/>
  <text x="86" y="754" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0F172A">FTS / Semantic / Hybrid</text>
  <rect x="280" y="740" width="18" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text x="306" y="754" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0F172A">Vector (multimedia only)</text>
  <rect x="520" y="740" width="18" height="18" rx="3" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="546" y="754" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#0F172A">Vector disabled for article &amp; journalist</text>
</svg>
