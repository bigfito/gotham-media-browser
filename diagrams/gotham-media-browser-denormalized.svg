<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Gotham Media Browser denormalized Elasticsearch document</title>
  <desc id="desc">Graphical representation of the gotham-media-browser article document with editorial fields, metadata, nested journalists and multimedia, and search projections.</desc>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #0F172A; stroke-width: 2; }
      .title { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #475569; }
      .band-label { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; }
      .field { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0F172A; }
      .chip { fill: #FFFFFF; stroke-width: 1.2; }
      .small { font: 400 11px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #334155; }
      .legend { font: 600 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0F172A; }
      .arrow { stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow); }
      .arrow-label { font: 600 10px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748B; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="860"/>
  <text class="title" x="40" y="42">Gotham News &amp; Media Browser — Denormalized ES Model</text>
  <text class="subtitle" x="40" y="64">Index: gotham-media-browser · one document per Article · Elasticsearch 9.x</text>

  <rect class="frame" x="30" y="90" width="1220" height="680" rx="14"/>
  <text class="title" x="50" y="124" style="font-size:16px">Article Document  (_id = article_id)</text>

  <!-- Editorial -->
  <rect x="50" y="145" width="1180" height="100" rx="8" fill="#0F766E"/>
  <text class="band-label" x="66" y="168">1 · Editorial</text>
  <g transform="translate(66,182)">
    <rect class="chip" x="0" y="0" width="90" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="10" y="17">article_id</text>
    <rect class="chip" x="100" y="0" width="70" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="110" y="17">title</text>
    <rect class="chip" x="180" y="0" width="80" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="190" y="17">subtitle</text>
    <rect class="chip" x="270" y="0" width="80" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="280" y="17">summary</text>
    <rect class="chip" x="360" y="0" width="60" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="370" y="17">body</text>
    <rect class="chip" x="430" y="0" width="60" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="440" y="17">slug</text>
    <rect class="chip" x="500" y="0" width="70" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="510" y="17">status</text>
    <rect class="chip" x="580" y="0" width="85" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="590" y="17">language</text>
    <rect class="chip" x="675" y="0" width="100" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="685" y="17">published_at</text>
    <rect class="chip" x="785" y="0" width="90" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="795" y="17">created_at</text>
    <rect class="chip" x="885" y="0" width="95" height="26" rx="6" stroke="#99F6E4"/><text class="field" x="895" y="17">updated_at</text>
  </g>
  <text class="small" x="66" y="232" fill="#CCFBF1">types: long · text · keyword · date</text>

  <!-- Metadata -->
  <rect x="50" y="260" width="1180" height="90" rx="8" fill="#1D4ED8"/>
  <text class="band-label" x="66" y="283">2 · Article metadata (flattened)</text>
  <g transform="translate(66,297)">
    <rect class="chip" x="0" y="0" width="75" height="26" rx="6" stroke="#BFDBFE"/><text class="field" x="10" y="17">section</text>
    <rect class="chip" x="85" y="0" width="55" height="26" rx="6" stroke="#BFDBFE"/><text class="field" x="95" y="17">tags</text>
    <rect class="chip" x="150" y="0" width="80" height="26" rx="6" stroke="#BFDBFE"/><text class="field" x="160" y="17">location</text>
    <rect class="chip" x="240" y="0" width="70" height="26" rx="6" stroke="#BFDBFE"/><text class="field" x="250" y="17">source</text>
    <rect class="chip" x="320" y="0" width="85" height="26" rx="6" stroke="#BFDBFE"/><text class="field" x="330" y="17">seo_title</text>
    <rect class="chip" x="415" y="0" width="120" height="26" rx="6" stroke="#BFDBFE"/><text class="field" x="425" y="17">seo_description</text>
    <rect class="chip" x="545" y="0" width="110" height="26" rx="6" stroke="#BFDBFE"/><text class="field" x="555" y="17">seo_keywords</text>
    <rect class="chip" x="665" y="0" width="115" height="26" rx="6" stroke="#BFDBFE"/><text class="field" x="675" y="17">canonical_url</text>
  </g>

  <!-- Nested -->
  <rect x="50" y="365" width="580" height="175" rx="8" fill="#7C2D12"/>
  <text class="band-label" x="66" y="388">3a · journalists[]  nested</text>
  <text class="small" x="66" y="410" fill="#FED7AA">journalist_id, first_name, last_name, full_name,</text>
  <text class="small" x="66" y="428" fill="#FED7AA">email, bio, byline_order, contribution_role</text>
  <rect x="66" y="445" width="530" height="70" rx="6" fill="#FFF7ED" stroke="#FDBA74"/>
  <text class="field" x="80" y="470">Also flattened to root: journalist_names</text>
  <text class="small" x="80" y="492">Used for byline filters + nested queries; names copied into search projections by indexer</text>

  <rect x="650" y="365" width="580" height="175" rx="8" fill="#9A3412"/>
  <text class="band-label" x="666" y="388">3b · multimedia[]  nested</text>
  <text class="small" x="666" y="410" fill="#FFEDD5">multimedia_element_id, media_type, mime_type, position,</text>
  <text class="small" x="666" y="428" fill="#FFEDD5">caption, credit, title, description, alt_text, technical attrs</text>
  <rect x="666" y="445" width="540" height="70" rx="6" fill="#FFF7ED" stroke="#FDBA74"/>
  <text class="field" x="680" y="470">Also flattened to root: multimedia_text</text>
  <text class="small" x="680" y="492">IMAGE | AUDIO | VIDEO metadata denormalized into each nested object</text>

  <!-- Search projections -->
  <rect x="50" y="555" width="1180" height="190" rx="8" fill="#14532D"/>
  <text class="band-label" x="66" y="578">4 · Search projections</text>

  <rect x="66" y="595" width="250" height="120" rx="8" fill="#FEF3C7" stroke="#D97706"/>
  <text class="field" x="82" y="620" style="font-weight:700">search_text</text>
  <text class="small" x="82" y="642">type: text</text>
  <text class="small" x="82" y="660">Full-text / BM25</text>
  <text class="small" x="82" y="678">copy_to target</text>
  <text class="small" x="82" y="696">gotham_english analyzer</text>

  <rect x="336" y="595" width="250" height="120" rx="8" fill="#D1FAE5" stroke="#059669"/>
  <text class="field" x="352" y="620" style="font-weight:700">content_semantic</text>
  <text class="small" x="352" y="642">type: semantic_text</text>
  <text class="small" x="352" y="660">Semantic + hybrid</text>
  <text class="small" x="352" y="678">inference + chunking</text>
  <text class="small" x="352" y="696">int8_hnsw</text>

  <rect x="606" y="595" width="270" height="120" rx="8" fill="#A7F3D0" stroke="#047857"/>
  <text class="field" x="622" y="620" style="font-weight:700">multimedia_semantic</text>
  <text class="small" x="622" y="642">type: semantic_text</text>
  <text class="small" x="622" y="660">Media-focused semantic</text>
  <text class="small" x="622" y="678">from multimedia_text</text>
  <text class="small" x="622" y="696">copy_to target</text>

  <rect x="896" y="595" width="310" height="120" rx="8" fill="#DBEAFE" stroke="#2563EB"/>
  <text class="field" x="912" y="620" style="font-weight:700">content_vector</text>
  <text class="small" x="912" y="642">type: dense_vector</text>
  <text class="small" x="912" y="660">Vector / kNN search</text>
  <text class="small" x="912" y="678">dims=768 · cosine</text>
  <text class="small" x="912" y="696">int8_hnsw · pipeline-supplied</text>

  <!-- Legend -->
  <rect x="30" y="790" width="18" height="18" rx="3" fill="#FEF3C7" stroke="#D97706"/>
  <text class="legend" x="56" y="804">Full-text</text>
  <rect x="150" y="790" width="18" height="18" rx="3" fill="#D1FAE5" stroke="#059669"/>
  <text class="legend" x="176" y="804">Semantic</text>
  <rect x="280" y="790" width="18" height="18" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
  <text class="legend" x="306" y="804">Vector / kNN</text>
  <rect x="430" y="790" width="18" height="18" rx="3" fill="#E2E8F0" stroke="#475569"/>
  <text class="legend" x="456" y="804">Hybrid = RRF(full-text + semantic [+ knn])</text>
  <text class="subtitle" x="820" y="804">Relational ER remains source of truth</text>
</svg>
