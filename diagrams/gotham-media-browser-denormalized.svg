<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Gotham News — dual-index denormalized model</title>
  <desc id="desc">gotham-journalists feeds nested bylines on gotham-media-browser; ImageBind 1024-d embeddings; public GCS media.</desc>
  <defs>
    <style>
      .bg { fill: #F7F9FC; }
      .box { fill: #ffffff; stroke: #d9e3ee; stroke-width: 1.5; }
      .title { font: 650 20px Fraunces, Georgia, serif; fill: #2c3e5a; }
      .h { font: 600 14px Sora, Helvetica, sans-serif; fill: #2c3e5a; }
      .t { font: 400 12px Sora, Helvetica, sans-serif; fill: #5a6b84; }
      .accent { fill: #5fad98; }
      .sky { fill: #6a9cc4; }
      .coral { fill: #d4878a; }
      .line { stroke: #9ec5e8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6a9cc4"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="640"/>
  <text class="title" x="40" y="42">Gotham News &amp; Media Browser — Dual Index</text>
  <text class="t" x="40" y="64">ES auto _id · ImageBind 1024-d · no semantic_text · no /admin</text>

  <!-- Journalists -->
  <rect class="box" x="40" y="100" width="300" height="200" rx="12"/>
  <circle cx="60" cy="122" r="6" class="accent"/>
  <text class="h" x="76" y="127">gotham-journalists</text>
  <text class="t" x="56" y="156">CRUD: /journalist</text>
  <text class="t" x="56" y="176">_id (ES auto)</text>
  <text class="t" x="56" y="196">first_name · last_name · full_name</text>
  <text class="t" x="56" y="216">email · bio · timestamps</text>
  <text class="t" x="56" y="246">No public search UI</text>
  <text class="t" x="56" y="266">Feeds article bylines</text>

  <!-- Articles -->
  <rect class="box" x="420" y="100" width="420" height="360" rx="12"/>
  <circle cx="440" cy="122" r="6" class="sky"/>
  <text class="h" x="456" y="127">gotham-media-browser</text>
  <text class="t" x="440" y="156">CRUD: /article · Search: / + /results</text>
  <text class="t" x="440" y="176">_id (ES auto) · status DRAFT|PUBLISHED|ARCHIVED</text>
  <text class="t" x="440" y="196">title · subtitle · summary · body · slug · seo_*</text>
  <text class="t" x="440" y="216">section · tags · location · source · canonical_url</text>
  <text class="t" x="440" y="246">journalists[] nested → journalist_id = master _id</text>
  <text class="t" x="440" y="266">contribution_role AUTHOR|CO_AUTHOR|CONTRIBUTING</text>
  <text class="t" x="440" y="296">multimedia[] nested · multimedia_element_id (app)</text>
  <text class="t" x="440" y="316">storage_uri → public GCS · asset_vector dims=1024</text>
  <text class="t" x="440" y="346">article_embedding dims=1024 (ImageBind)</text>
  <text class="t" x="440" y="366">*_search_text projections (app + copy_to)</text>
  <text class="t" x="440" y="396">Article: FTS · Semantic · Hybrid</text>
  <text class="t" x="440" y="416">Multimedia: FTS · Semantic · Hybrid · Vector</text>
  <text class="t" x="440" y="436">Pagination: from=(page-1)×size · size∈{25,50,100}</text>

  <!-- ImageBind + GCS -->
  <rect class="box" x="880" y="100" width="180" height="120" rx="12"/>
  <circle cx="900" cy="122" r="6" class="coral"/>
  <text class="h" x="916" y="127">ImageBind</text>
  <text class="t" x="896" y="156">:8081 health</text>
  <text class="t" x="896" y="176">text/image/audio/video</text>
  <text class="t" x="896" y="196">→ float[1024]</text>

  <rect class="box" x="880" y="250" width="180" height="100" rx="12"/>
  <text class="h" x="896" y="280">GCS public</text>
  <text class="t" x="896" y="304">storage_uri HTTPS</text>
  <text class="t" x="896" y="324">no signed URLs</text>

  <path class="line" d="M340,200 H420"/>
  <path class="line" d="M840,200 H880"/>
  <path class="line" d="M840,320 H880"/>

  <text class="t" x="40" y="560">gotham-web (:8080) · Thymeleaf · Java 25 / Spring Boot 4.1.1 · Elastic Cloud Serverless</text>
  <text class="t" x="40" y="584">UI mockups: ui-mockups/ · Spec: docs/architecture-end-to-end.md</text>
  <text class="t" x="40" y="608">© 2020 Packt · © 2026 · MIT</text>
</svg>
