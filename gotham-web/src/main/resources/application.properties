# =============================================================================
#  gotham-web configuration (COMMITTED FILE — PLACEHOLDERS ONLY)
#
#  Real secrets/values are NEVER committed here. Provide them via either:
#    * an untracked application-local.properties next to the run dir (gitignored), or
#    * environment variables (Spring relaxed binding, e.g. GOTHAM_ELASTICSEARCH_API_KEY).
#  The optional import below loads the local override when present.
# =============================================================================
spring.application.name=gotham-web

# Fault tolerance: no Whitelabel page — all errors render the branded error.html (P1-T04).
server.error.whitelabel.enabled=false

# Loads real ES/GCS values from the untracked repo-root file when present (optional: no error if
# missing). Both paths make it work whether the process runs from the repo root (file:./) or from
# a module dir such as gotham-web/ (file:../).
spring.config.import=optional:file:./application-local.properties,optional:file:../application-local.properties

# --- Elasticsearch (Elastic Cloud Serverless) — placeholders ---
gotham.elasticsearch.endpoint=https://YOUR-ES-ENDPOINT
gotham.elasticsearch.api-key=YOUR_API_KEY

# --- Google Cloud Storage (public bucket) — placeholders ---
gotham.gcs.project-id=YOUR_GCP_PROJECT
gotham.gcs.bucket=YOUR_PUBLIC_BUCKET
gotham.gcs.credentials-file=secrets/gcp-sa.json

# --- ImageBind embedding service ---
gotham.imagebind.base-url=http://imagebind-service:8081

# --- Media upload limits (local CPU ImageBind) — real defaults, not secrets ---
gotham.media.image.max-size=10MB
gotham.media.audio.max-size=20MB
gotham.media.audio.max-duration=5m
gotham.media.video.max-size=50MB
gotham.media.video.max-duration=90s

# Multipart limits for article media uploads. Per-file covers the largest asset (VIDEO 50 MB);
# the request cap allows several files at once (the app also enforces per-type limits itself).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=350MB
