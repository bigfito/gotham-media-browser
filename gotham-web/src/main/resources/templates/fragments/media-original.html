<!DOCTYPE html>
<!--
  Clickable IMAGE preview. The thumbnail stays CSS-constrained in the card; the href is the
  public GCS original. chrome.js opens a child window sized to width/height when known.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<a th:fragment="preview(uri, width, height, altText)"
   class="media-card__original"
   th:href="${uri}"
   target="gothamOriginalImage"
   rel="noopener noreferrer"
   title="Open original-size image in a new window"
   aria-label="Open original-size image in a new window"
   th:attr="data-width=${width},data-height=${height}">
    <img th:src="${uri}" th:alt="${altText}" loading="lazy"/>
</a>
</body>
</html>
