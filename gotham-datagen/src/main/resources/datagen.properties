# gotham-datagen configuration (defaults shown; override via -Dgotham.datagen.* or --key=value).
# This module loads data ONLY through the running gotham-web HTTP CRUD — never directly to ES/GCS.

# Target application (all journalist/article loads go here).
gotham.datagen.web-base-url=http://localhost:8080

# Generative helper endpoints (Docker Compose profile `datagen`; used from P10-T03).
gotham.datagen.ollama-url=http://localhost:11434
gotham.datagen.comfyui-url=http://localhost:8188
gotham.datagen.kokoro-url=http://localhost:8880

# Text model (required). Images/audio/video are skippable when their helper is down.
gotham.datagen.text-model=qwen2.5:7b-instruct

# Locked default volumes: 15 journalists, 25 articles, 5 IMAGE + 5 AUDIO + 5 VIDEO each, 5 s clips.
gotham.datagen.journalists=15
gotham.datagen.articles=25
gotham.datagen.images-per-article=5
gotham.datagen.audio-per-article=5
gotham.datagen.video-per-article=5
gotham.datagen.video-seconds=5

# Skip flags for when a media helper is unavailable (text is never skippable).
gotham.datagen.skip-image=false
gotham.datagen.skip-audio=false
gotham.datagen.skip-video=false
